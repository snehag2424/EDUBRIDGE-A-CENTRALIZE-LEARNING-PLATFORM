
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduBridge — First Year Engineering Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0A1220;
    --navy-panel:#101B2E;
    --navy-panel-2:#0D1725;
    --grid-line: rgba(56,189,248,0.09);
    --grid-line-strong: rgba(56,189,248,0.16);
    --cyan:#38BDF8;
    --cyan-soft:#7DD3FC;
    --amber:#F2A93B;
    --text-hi:#EAF1FA;
    --text-mid:#A9B9D1;
    --text-dim:#6E7F9B;
    --border:#1E2C45;
    --border-soft:#16223A;
    --success:#34D399;
    --danger:#F0654F;
    --white-ink:#0A1220;
    --radius:10px;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--navy-deep);
    color:var(--text-hi);
    font-family:var(--body);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:34px 34px;
    min-height:100vh;
    overflow-x:hidden;
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}
  a{color:inherit; text-decoration:none;}
  button{font-family:var(--body); cursor:pointer;}
  input,select,button{font-family:var(--body); font-size:14px;}
  ::selection{background:var(--cyan); color:var(--white-ink);}
 
  /* ---------- top nav ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 34px;
    border-bottom:1px solid var(--border-soft);
    background:linear-gradient(180deg, rgba(16,27,46,0.9), rgba(16,27,46,0.55));
    backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:50;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{width:38px;height:38px;flex-shrink:0;}
  .brand-word{font-family:var(--display); font-weight:700; font-size:21px; letter-spacing:0.2px;}
  .brand-tag{font-size:11.5px; color:var(--text-dim); margin-top:1px;}
  .role-chip{
    font-family:var(--mono); font-size:11px; padding:5px 11px; border-radius:20px;
    border:1px solid var(--border); color:var(--cyan-soft); background:rgba(56,189,248,0.06);
  }
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .logout-link{font-size:13px; color:var(--text-mid); border:1px solid var(--border); padding:8px 16px; border-radius:8px; background:transparent; transition:all .15s;}
  .logout-link:hover{color:var(--text-hi); border-color:var(--cyan); }
 
  main{flex:1; width:100%;}
 
  /* ---------- generic building blocks ---------- */
  .container{max-width:1600px; margin:0 auto; padding:0 34px;}
  .container-fluid{width:100%; max-width:none; margin:0; padding:0;}
  .btn{
    border:none; border-radius:8px; padding:13px 22px; font-weight:600; font-size:14.5px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .12s, filter .12s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--cyan); color:var(--white-ink);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; color:var(--text-mid); border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text-hi); border-color:var(--cyan);}
  .btn-amber{background:var(--amber); color:#241505;}
  .btn-amber:hover{filter:brightness(1.06);}
  .btn-full{width:100%;}
  .btn-sm{padding:8px 14px; font-size:13px;}
 
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-mid); margin-bottom:7px; letter-spacing:0.2px;}
  .field input, .field select{
    width:100%; background:var(--navy-panel-2); border:1px solid var(--border); color:var(--text-hi);
    padding:12px 13px; border-radius:8px; outline:none; transition:border-color .15s;
  }
  .field input:focus, .field select:focus{border-color:var(--cyan);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .helper{font-size:12px; color:var(--text-dim); margin-top:6px;}
  .error-text{font-size:12px; color:var(--danger); margin-top:6px; min-height:14px;}
 
  .panel{background:var(--navy-panel); border:1px solid var(--border-soft); border-radius:var(--radius);}
  .badge-mono{
    font-family:var(--mono); font-size:11px; font-weight:600; color:var(--cyan-soft);
    background:rgba(56,189,248,0.08); border:1px solid rgba(56,189,248,0.25);
    padding:3px 8px; border-radius:5px; letter-spacing:0.3px;
  }
 
  .truss{position:absolute; inset:0; pointer-events:none; opacity:0.5;}
 
  /* ================= AUTH SCREENS ================= */
  .auth-wrap{display:flex; min-height:calc(100vh - 71px);}
  .auth-hero{
    flex:1.15; position:relative; padding:70px 60px; display:flex; flex-direction:column; justify-content:center;
    border-right:1px solid var(--border-soft);
    background:radial-gradient(ellipse 700px 480px at 20% 20%, rgba(56,189,248,0.10), transparent 60%);
  }
  .auth-hero h1{
    font-family:var(--display); font-size:44px; line-height:1.12; font-weight:700; max-width:520px; margin:0 0 18px 0;
  }
  .auth-hero p{color:var(--text-mid); font-size:15.5px; max-width:440px; line-height:1.6; margin:0 0 34px 0;}
  .hero-stats{display:flex; gap:34px; margin-top:10px;}
  .hero-stat b{font-family:var(--display); font-size:26px; display:block; color:var(--cyan-soft);}
  .hero-stat span{font-size:12px; color:var(--text-dim);}
  .auth-form-side{flex:1; display:flex; align-items:center; justify-content:center; padding:50px;}
  .auth-card{width:100%; max-width:400px;}
  .auth-card h2{font-family:var(--display); font-size:27px; margin:0 0 6px 0;}
  .auth-card .sub{color:var(--text-mid); font-size:14px; margin:0 0 30px 0;}
  .switch-line{margin-top:22px; font-size:13.5px; color:var(--text-mid); text-align:center;}
  .switch-line button{background:none; border:none; color:var(--cyan-soft); font-weight:600; padding:0; font-size:13.5px;}
 
  .segmented{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:22px;}
  .segmented button{
    flex:1; background:var(--navy-panel-2); color:var(--text-mid); border:none; padding:11px 0; font-weight:600; font-size:13.5px;
    border-right:1px solid var(--border);
  }
  .segmented button:last-child{border-right:none;}
  .segmented button.active{background:var(--cyan); color:var(--white-ink);}
 
  .bridge-strip{width:100%; height:64px; opacity:0.7;}
 
  /* ================= DASHBOARD ================= */
  .page-head{padding:44px 0 26px 0;}
  .page-head h1{font-family:var(--display); font-size:30px; margin:0 0 6px 0;}
  .page-head p{color:var(--text-mid); margin:0; font-size:14.5px;}
  .eyebrow{font-family:var(--mono); font-size:12px; color:var(--amber); margin-bottom:10px; display:block;}
 
  .bento{display:grid; grid-template-columns:repeat(6,1fr); gap:16px; padding-bottom:50px;}
  .bento-card{
    border:1px solid var(--border-soft); border-radius:var(--radius); background:var(--navy-panel);
    padding:22px; cursor:pointer; transition:border-color .15s, transform .12s; position:relative; overflow:hidden;
  }
  .bento-card:hover{border-color:var(--cyan); transform:translateY(-2px);}
  .bento-card .ic{font-size:26px; margin-bottom:14px; display:block;}
  .bento-card h3{font-family:var(--display); font-size:17px; margin:0 0 5px 0;}
  .bento-card p{color:var(--text-dim); font-size:12.5px; margin:0;}
  .span-3{grid-column:span 3;}
  .span-2{grid-column:span 2;}
  .span-4{grid-column:span 4;}
  .span-6{grid-column:span 6;}
 
  /* ================= STUDY MATERIAL (batch overview) ================= */
  .batch-banner{
    background:linear-gradient(120deg, #0C1830 0%, #0A1220 60%);
    border-bottom:1px solid var(--border-soft);
    padding:38px 0 0 0;
    position:relative;
  }
  .batch-banner-inner{display:flex; justify-content:space-between; align-items:flex-end; padding-bottom:0;}
  .batch-banner h1{font-family:var(--display); font-size:26px; margin:0 0 8px 0; max-width:640px;}
  .batch-banner .meta{display:flex; gap:18px; color:var(--text-dim); font-size:12.5px; margin-bottom:22px; flex-wrap:wrap;}
  .batch-banner .meta span{display:flex; align-items:center; gap:6px;}
 
  .tabbar{display:flex; gap:4px; border-bottom:1px solid var(--border-soft); background:var(--navy-panel-2);}
  .tabbar-inner{display:flex; gap:6px; overflow-x:auto;}
  .tab-btn{
    background:none; border:none; color:var(--text-dim); font-weight:600; font-size:13.5px;
    padding:15px 6px; border-bottom:2px solid transparent; white-space:nowrap;
  }
  .tab-btn.active{color:var(--cyan-soft); border-bottom-color:var(--cyan);}
 
  .info-strip{background:#0F2436; border-bottom:1px solid var(--border-soft); padding:10px 0;}
  .info-strip-inner{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--cyan-soft);}
  .info-strip button{background:none; border:none; color:var(--text-dim); font-size:15px;}
 
  .material-body{padding:34px 0 60px 0; min-height:340px;}
 
  .subject-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .subject-card{
    display:flex; align-items:center; gap:16px; padding:18px; border:1px solid var(--border-soft);
    border-radius:var(--radius); background:var(--navy-panel); cursor:pointer; transition:border-color .15s;
  }
  .subject-card:hover{border-color:var(--cyan);}
  .subject-code{
    font-family:var(--mono); font-weight:700; font-size:12px; color:var(--navy-deep); background:var(--cyan-soft);
    min-width:52px; height:44px; padding:0 6px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .subject-info{flex:1; min-width:0;}
  .subject-info .name{font-weight:600; font-size:15px; margin-bottom:8px;}
  .subject-info .prog-row{display:flex; align-items:center; gap:10px;}
  .prog-track{flex:1; height:6px; background:var(--border-soft); border-radius:4px; overflow:hidden;}
  .prog-fill{height:100%; background:linear-gradient(90deg, var(--cyan), var(--cyan-soft)); border-radius:4px; transition:width .3s;}
  .prog-pct{font-family:var(--mono); font-size:11.5px; color:var(--text-dim); width:34px; text-align:right;}
  .chevron{color:var(--text-dim); font-size:20px;}
 
  .list-row{
    display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border:1px solid var(--border-soft);
    border-radius:var(--radius); background:var(--navy-panel); margin-bottom:10px;
  }
  .list-row .left{display:flex; align-items:center; gap:12px;}
  .list-row .left .dot{width:8px; height:8px; border-radius:50%; background:var(--cyan);}
  .announcement-row{padding:16px 18px; border-left:2px solid var(--amber); background:var(--navy-panel); margin-bottom:10px; border-radius:0 8px 8px 0;}
  .announcement-row .date{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:4px;}
 
  .desc-text{color:var(--text-mid); line-height:1.75; font-size:14.5px; max-width:680px;}
 
  /* ================= modal ================= */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,10,18,0.72); display:flex; align-items:center; justify-content:center;
    z-index:200; backdrop-filter:blur(3px);
  }
  .modal-box{background:var(--navy-panel); border:1px solid var(--border); border-radius:12px; width:100%; max-width:400px; padding:30px;}
  .modal-box h3{font-family:var(--display); font-size:19px; margin:0 0 18px 0;}
 
  /* ================= assignments / progress / profile ================= */
  .assign-row{display:flex; align-items:center; gap:14px; padding:16px 18px; border:1px solid var(--border-soft); border-radius:var(--radius); background:var(--navy-panel); margin-bottom:10px;}
  .assign-row input[type=checkbox]{width:18px; height:18px; accent-color:var(--cyan);}
  .assign-row .name{flex:1; font-size:14.5px;}
  .assign-row .subject-tag{font-family:var(--mono); font-size:10.5px; color:var(--text-dim);}
 
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:26px 0 32px 0;}
  .stat-card{background:var(--navy-panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:22px; text-align:center;}
  .stat-card .ic{font-size:22px; margin-bottom:10px; display:block;}
  .stat-card b{font-family:var(--display); font-size:24px; display:block; color:var(--cyan-soft);}
  .stat-card span{font-size:11.5px; color:var(--text-dim);}
  .overall-bar-wrap{margin:18px 0 8px 0;}
  .overall-num{font-family:var(--display); font-size:38px; color:var(--cyan-soft);}
  .overall-track{height:10px; background:var(--border-soft); border-radius:6px; overflow:hidden; margin-top:14px;}
 
  .profile-grid{display:grid; grid-template-columns:1fr 1fr; gap:0; border:1px solid var(--border-soft); border-radius:var(--radius); overflow:hidden;}
  .profile-item{padding:18px 22px; border-bottom:1px solid var(--border-soft); border-right:1px solid var(--border-soft);}
  .profile-item:nth-child(2n){border-right:none;}
  .profile-item .k{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:6px; letter-spacing:0.3px;}
  .profile-item .v{font-size:14.5px; font-weight:500;}
 
  /* ================= AI chat ================= */
  .chat-shell{display:flex; flex-direction:column; height:520px; border:1px solid var(--border-soft); border-radius:var(--radius); background:var(--navy-panel); overflow:hidden;}
  .chat-log{flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:14px;}
  .msg{max-width:72%; padding:12px 15px; border-radius:10px; font-size:14px; line-height:1.55; white-space:pre-wrap;}
  .msg.bot{background:var(--navy-panel-2); border:1px solid var(--border-soft); align-self:flex-start; border-bottom-left-radius:2px;}
  .msg.user{background:var(--cyan); color:var(--white-ink); align-self:flex-end; border-bottom-right-radius:2px; font-weight:500;}
  .msg .sender{font-family:var(--mono); font-size:10px; opacity:0.65; display:block; margin-bottom:4px;}
  .chat-input-bar{display:flex; gap:10px; padding:16px; border-top:1px solid var(--border-soft);}
  .chat-input-bar input{flex:1; background:var(--navy-panel-2); border:1px solid var(--border); color:var(--text-hi); padding:12px 13px; border-radius:8px; outline:none;}
  .chat-input-bar input:focus{border-color:var(--cyan);}
 
  /* ================= mentor ================= */
  .mentor-list{max-height:420px; overflow-y:auto;}
  .mentor-student-row{display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--border-soft);}
  .mentor-student-row:last-child{border-bottom:none;}
 
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
 
  /* ================= SUBJECT DETAIL (chapters + tabs) ================= */
  .subject-hero{
    background:linear-gradient(120deg, #0C1830 0%, #0A1220 60%);
    border-bottom:1px solid var(--border-soft);
    padding:34px 0 0 0;
  }
  .subject-hero-inner{display:flex; justify-content:space-between; align-items:flex-end; padding:0 34px;}
  .subject-hero .subject-code-lg{
    font-family:var(--mono); font-weight:700; font-size:14px; color:var(--navy-deep); background:var(--cyan-soft);
    min-width:56px; height:46px; padding:0 10px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; margin-bottom:14px;
  }
  .subject-hero h1{font-family:var(--display); font-size:27px; margin:0 0 8px 0;}
  .subject-hero .meta{display:flex; gap:18px; color:var(--text-dim); font-size:12.5px; margin-bottom:22px; flex-wrap:wrap;}
 
  .subject-detail-layout{display:flex; gap:0; align-items:stretch; width:100%; min-height:calc(100vh - 260px);}
  .chapter-sidebar{
    width:300px; flex-shrink:0; border-right:1px solid var(--border-soft); background:var(--navy-panel-2);
    padding:22px 16px 22px 26px;
  }
  .chapter-sidebar-title{font-family:var(--mono); font-size:11px; color:var(--text-dim); letter-spacing:0.6px; padding:0 8px 12px 8px;}
  .chapter-group-label{font-family:var(--mono); font-size:10.5px; color:var(--amber); letter-spacing:0.5px; padding:14px 8px 6px 8px;}
  .chapter-item{
    display:flex; align-items:center; gap:10px; padding:12px 10px; border-radius:8px; cursor:pointer; margin-bottom:4px;
    border-left:3px solid transparent;
  }
  .chapter-item:hover{background:rgba(56,189,248,0.06);}
  .chapter-item.active{background:rgba(56,189,248,0.10); border-left-color:var(--cyan);}
  .chapter-item .chip{
    font-family:var(--mono); font-size:10.5px; font-weight:700; color:var(--cyan-soft);
    background:rgba(56,189,248,0.08); border:1px solid rgba(56,189,248,0.25); padding:3px 7px; border-radius:5px; flex-shrink:0;
  }
  .chapter-item.active .chip{background:var(--cyan); color:var(--white-ink); border-color:var(--cyan);}
  .chapter-item .ctitle{font-size:13px; color:var(--text-mid); line-height:1.3;}
  .chapter-item.active .ctitle{color:var(--text-hi); font-weight:600;}
 
  .subject-main{flex:1; min-width:0; padding:28px 44px 60px 44px;}
  .subject-back{padding:24px 34px 50px 34px;}
  .subject-tabbar{display:flex; gap:22px; border-bottom:1px solid var(--border-soft); margin-bottom:26px; overflow-x:auto;}
  .subject-tabbar button{
    background:none; border:none; color:var(--text-dim); font-weight:600; font-size:14px;
    padding:0 0 14px 0; border-bottom:2px solid transparent; white-space:nowrap;
  }
  .subject-tabbar button.active{color:var(--cyan-soft); border-bottom-color:var(--cyan);}
 
  .doc-card{background:var(--navy-panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:26px; margin-bottom:18px;}
  .doc-card h4{font-family:var(--display); font-size:16px; margin:0 0 14px 0; color:var(--cyan-soft);}
  .doc-meta-row{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px;}
  .doc-meta-pill{font-family:var(--mono); font-size:11.5px; color:var(--text-mid); background:var(--navy-panel-2); border:1px solid var(--border); padding:6px 11px; border-radius:6px;}
  .doc-list{margin:0; padding-left:20px; color:var(--text-mid); font-size:13.5px; line-height:1.85;}
  .doc-unit-title{font-weight:600; font-size:15px; color:var(--text-hi); margin-bottom:6px;}
  .doc-unit-hours{font-family:var(--mono); font-size:11.5px; color:var(--amber); margin-bottom:12px; display:inline-block;}
 
  .lecture-card{display:flex; gap:18px; padding:20px; border:1px solid var(--border-soft); border-radius:var(--radius); background:var(--navy-panel); margin-bottom:14px;}
  .lecture-thumb{
    width:120px; height:80px; border-radius:8px; flex-shrink:0; background:linear-gradient(135deg, #16233c, #0d1725);
    display:flex; align-items:center; justify-content:center; font-size:28px; border:1px solid var(--border-soft); position:relative;
  }
  .lecture-thumb .play-dot{position:absolute; bottom:6px; right:6px; width:22px; height:22px; border-radius:50%; background:var(--danger); display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;}
  .lecture-info{flex:1; min-width:0;}
  .lecture-info .kind{font-size:12px; color:var(--text-dim); margin-bottom:4px;}
  .lecture-info .title{font-weight:600; font-size:15px; margin-bottom:10px;}
  .lecture-actions{display:flex; gap:10px; margin-top:12px;}
 
  .qp-row{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border:1px solid var(--border-soft); border-radius:var(--radius); background:var(--navy-panel); margin-bottom:10px;}
  .qp-row .left{display:flex; align-items:center; gap:12px;}
  .qp-icon{width:36px; height:36px; border-radius:8px; background:rgba(242,169,59,0.12); border:1px solid rgba(242,169,59,0.3); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
 
  .qb-card{background:var(--navy-panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:24px 26px; margin-bottom:16px;}
  .qb-head{display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .qb-head h4{font-family:var(--display); font-size:16px; margin:0; color:var(--text-hi);}
  .qb-list{margin:0; padding-left:22px; color:var(--text-mid); font-size:14px; line-height:1.7;}
  .qb-list li{margin-bottom:12px; padding-left:4px;}
  .qb-code{
    font-family:var(--mono); font-size:12.5px; color:var(--cyan-soft); background:var(--navy-panel-2);
    border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin:8px 0 0 0; white-space:pre-wrap; line-height:1.6;
  }

/* ---------------- storage helpers ----------------
   Uses window.storage when available (Claude artifacts),
   otherwise falls back to localStorage so it also works
   when you open this file in a normal browser. */
async function loadUsers(){
  try{
    if(window.storage){
      const res = await window.storage.get(USERS_KEY, false);
      if(res && res.value) return JSON.parse(res.value);
      return {};
    }
    const raw = localStorage.getItem(USERS_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
async function saveUsers(){
  try{
    if(window.storage){
      await window.storage.set(USERS_KEY, JSON.stringify(users), false);
    } else {
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }
  }catch(e){ console.error("storage save failed", e); }
}
 
/* ---------------- utils ---------------- */
function calcAge(day, monthName, year){
  const mi = MONTHS.indexOf(monthName);
  const born = new Date(year, mi, day);
  const today = new Date();
  let age = today.getFullYear() - born.getFullYear();
  const m = today.getMonth() - born.getMonth();
  if(m < 0 || (m===0 && today.getDate() < born.getDate())) age--;
  return age;
}
function esc(s){ return (s==null?"":s).toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(html){ const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function render(html){ document.getElementById('app').innerHTML = html; window.scrollTo(0,0); }
function subjectName(code){ const s = SUBJECTS.find(x => x.code === code); return s ? s.name : code; }
 
function bridgeMark(size=38){

    <line x1="6" y1="27" x2="34" y2="27" stroke="#0A1220" stroke-width="2.4" stroke-linecap="round"/>
  </svg>`;
}
function trussStrip(){
  let segs = "";
  for(let x=0; x<1200; x+=60){
    segs += `<path d="M${x} 60 L${x+30} 20 L${x+60} 60" stroke="var(--grid-line-strong)" stroke-width="1.5" fill="none"/>`;
  }
  return `<svg class="bridge-strip" viewBox="0 0 1200 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="var(--grid-line-strong)" stroke-width="1.5"/>
    ${segs}
  </svg>`;
}

async function doRegister(){
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim().toLowerCase();
  const password = document.getElementById('reg-password').value;
  const confirm = document.getElementById('reg-confirm').value;
  const err = document.getElementById('reg-error');
 
  if(!name || !email || !password || !confirm){ err.textContent = "Please fill in all fields."; return; }
  const emailPattern = /^[\w.-]+@[\w.-]+\.\w+$/;
  if(!emailPattern.test(email)){ err.textContent = "Please enter a valid email address."; return; }
  if(password.length < 6){ err.textContent = "Password must contain at least 6 characters."; return; }
  if(password !== confirm){ err.textContent = "Passwords do not match."; return; }
  if(users[email]){ err.textContent = "This email is already registered."; return; }
 
  if(regRole === "mentor"){
    users[email] = { name, password, role:"mentor", department:"" };
  } else {
    const progress = {};
    SUBJECTS.forEach(s => progress[s.code] = 0);
    users[email] = {
      name, password, role:"student",
      dob:"", age:"", class:"", university:"", college:"", department:"", course:"", semester:"",
      subjectProgress: progress,
      progress: { study_hours:0, videos_watched:0, assignments_done:0, courses_completed:0 },
      assignmentsChecked: {}
    };
  }
  await saveUsers();
  alert("Your EduBridge account has been created! Please log in.");
  screenLogin();
}

function currentChapter(){
  const data = SYLLABUS_DATA[subjectDetailCode];
  if(!data || subjectDetailChapterIdx === -1) return null;
  return data[subjectDetailSection].units[subjectDetailChapterIdx];
}
 
/* Question bank block for the Question Papers tab.
   If a theory chapter is selected, only that unit's questions show. */
function questionBankHtml(){
  const bank = QUESTION_BANK[subjectDetailCode];
  if(!bank) return "";
  const chapter = currentChapter();
  const onlyUnit = (chapter && subjectDetailSection === "theory") ? chapter.no : null;
  const units = bank.units.filter(u => onlyUnit === null || u.no === onlyUnit);
  const total = units.reduce((n,u) => n + u.questions.length, 0);
  return `
    <div class="qb-title-row">
      <div class="qp-icon">📝</div>
      <div><b>${esc(bank.title)}</b><small>${units.length} ${units.length===1?"unit":"units"} · ${total} questions${onlyUnit!==null ? " · select Course Overview to see all units" : ""}</small></div>
    </div>
    ${units.map(u => `
      <div class="qb-card">
        <div class="qb-head"><span class="badge-mono">UNIT ${u.no}</span><h4>${esc(u.title)}</h4></div>
        <ol class="qb-list">
          ${u.questions.map(x => `
            <li>${esc(x.q)}${x.code ? `<pre class="qb-code">${esc(x.code)}</pre>` : ""}</li>`).join("")}
        </ol>
      </div>`).join("")}
    <div style="height:14px;"></div>
  `;
}

function renderSubjectTabContent(){
  const host = document.getElementById('subject-tab-content');
  const data = SYLLABUS_DATA[subjectDetailCode];
  const chapter = currentChapter();
  const name = subjectName(subjectDetailCode);
 
  if(subjectDetailTab === "Syllabus"){
    if(!data){ host.innerHTML = pendingBox("The syllabus"); return; }
    if(!chapter){
      /* Course overview: theory + lab course info */
      host.innerHTML = ['theory','lab'].filter(k => data[k]).map(key => {
        const sec = data[key];
        const sub = (t, m) => `<p style="color:var(--text-hi); font-weight:600; font-size:13.5px; margin:${m} 0 8px 0;">${t}</p>`;
        const olist = (t, arr, m) => (arr && arr.length) ? sub(t, m) + `<ol class="doc-list">${arr.map(o => `<li>${esc(o)}</li>`).join("")}</ol>` : "";
        const pills = [["Code",sec.courseCode],["Credits",sec.credits],["Scheme",sec.teachingScheme],["Evaluation",sec.evaluationScheme],["Duration",sec.duration]]
          .filter(([k,v]) => v !== undefined && v !== null && v !== "")
          .map(([k,v]) => `<span class="doc-meta-pill">${k}: ${esc(v)}</span>`).join("");
        return `
        <div class="doc-card">
          <h4>${esc(sec.label)} — Course Syllabus</h4>
          ${sec.note ? `<div class="paper-note" style="margin:0 0 16px 0;">ℹ️ ${esc(sec.note)}</div>` : ""}
          ${pills ? `<div class="doc-meta-row">${pills}</div>` : ""}
          ${sec.prerequisites && sec.prerequisites.length ? `<p style="color:var(--text-mid); font-size:13px; margin:0 0 14px 0;"><b>Prerequisites:</b> ${sec.prerequisites.map(x => esc(x)).join("; ")}</p>` : ""}
          ${olist("Course Objectives", sec.objectives, "0")}
          ${olist("Course Outcomes", sec.outcomes, "16px")}
          ${sub("Unit-wise Contents", "16px")}
          <ul class="doc-list" style="list-style:none; padding-left:0;">${sec.units.map(u => `<li style="margin-bottom:8px;"><b>Unit ${esc(u.no)}: ${esc(u.title)}</b> ${u.hours!=="\u2014" ? `(${esc(u.hours)} hrs)` : ""} — ${esc(u.content)}</li>`).join("")}</ul>
          ${olist("Text Books", sec.textbooks, "16px")}
          ${olist("Reference Books", sec.references, "16px")}
          ${olist("E-Resources", sec.eresources, "16px")}
        </div>`;
      }).join("");
    } else {
      host.innerHTML = `
        <div class="doc-card">
          <span class="doc-meta-pill" style="margin-bottom:10px; display:inline-block;">${esc(data[subjectDetailSection].label)} · Unit ${chapter.no}</span>
          <div class="doc-unit-title">${esc(chapter.title)}</div>
          ${chapter.hours!=="\u2014" ? `<span class="doc-unit-hours">⏱ ${esc(chapter.hours)} teaching hours</span>` : ""}
          <p class="desc-text" style="margin-top:10px;">${esc(chapter.content)}</p>
        </div>
      `;
    }
  } else if(subjectDetailTab === "PDF Notes"){
    if(!data){ host.innerHTML = pendingBox("PDF notes"); return; }
    const items = chapter ? [chapter] : [...data.theory.units];
    host.innerHTML = items.map(u => `
      <div class="lecture-card">
        <div class="lecture-thumb">📄</div>
        <div class="lecture-info">
          <div class="kind">PDF Notes · Unit ${u.no}</div>
          <div class="title">${esc(u.title)}</div>
          <div class="lecture-actions">
            <button class="btn btn-primary btn-sm" onclick="alert('Add the PDF link for Unit ${u.no} here to connect this button to a real file.')">📥 Download PDF</button>
          </div>
        </div>
      </div>`).join("");
  } else if(subjectDetailTab === "Question Papers"){
    const papers = [];
    host.innerHTML = endSemPapersHtml() + questionBankHtml() + papers.map(p => `
      <div class="qp-row">
        <div class="left">
          <div class="qp-icon">📝</div>
          <span>${esc(p)}</span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="alert('Add the question paper link here to connect this button to a real file.')">View</button>
      </div>`).join("");
  } else if(subjectDetailTab === "YouTube Videos"){
    if(!data){
      /* no unit list yet — offer a general search for the subject */
      const q = encodeURIComponent(`${name} first year engineering`);
      host.innerHTML = `
        <div class="lecture-card">
          <div class="lecture-thumb">▶️<span class="play-dot">▶</span></div>
          <div class="lecture-info">
            <div class="kind">Lectures</div>
            <div class="title">${esc(name)} — full course lectures</div>
            <div class="lecture-actions">
              <a class="btn btn-primary btn-sm" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">▶ Search on YouTube</a>
            </div>
          </div>
        </div>`;
      return;
    }
    const items = chapter ? [chapter] : [...data.theory.units];
    host.innerHTML = items.map(u => {
      const query = encodeURIComponent(`${name} ${u.title}`);
      return `
      <div class="lecture-card">
        <div class="lecture-thumb">▶️<span class="play-dot">▶</span></div>
        <div class="lecture-info">
          <div class="kind">Lecture · Unit ${u.no}</div>
          <div class="title">${esc(u.title)}</div>
          <div class="lecture-actions">
            <a class="btn btn-primary btn-sm" href="https://www.youtube.com/results?search_query=${query}" target="_blank" rel="noopener">▶ Watch on YouTube</a>
          </div>
        </div>
      </div>`;
    }).join("");
  }
}

async function saveAssignments(){
  const u = users[currentEmail];
  u.assignmentsChecked = u.assignmentsChecked || {};
  let doneCount = 0;
  SUBJECTS.forEach(s => {
    const checked = document.getElementById(`assign-${s.code}`).checked;

  u.progress = u.progress || {};

  await saveUsers();
  alert("Assignment progress updated successfully!");
}

  const log = document.getElementById('chat-log');
  const cls = sender === "You" ? "user" : "bot";
  log.appendChild(el(`<div class="msg ${cls}"><span class="sender">${esc(sender)}</span>${esc(text)}</div>`));

function generateAIAnswer(question){
  const q = question.toLowerCase();
  if(q.includes("python")) return "Python is a high-level programming language widely used in scripting, automation and data science.\n\nKey topics for this semester: input/output, loops, data structures (lists, tuples, sets, dictionaries), functions and modules, and NumPy / Matplotlib / Pandas.";
  if(q.includes("mechanics")) return "Engineering Mechanics deals with forces and their effects on bodies at rest or in motion.\n\nStart with free-body diagrams and equilibrium — most numericals build on them.";
  if(q.includes("chemistry")) return "Engineering Chemistry covers the chemical principles behind engineering — topics like water treatment, polymers, corrosion and fuels are common first-year focus areas.";
  if(q.includes("english") || q.includes("communicat")) return "Communicative English focuses on listening, speaking, reading and writing skills — practise emails, reports and short presentations regularly.";
  if(q.includes("beee") || q.includes("electrical") || q.includes("electronics")) return "BEEE introduces basic electrical and electronics engineering: circuit laws (Ohm, KCL, KVL), AC fundamentals, and basic devices like diodes and transistors.";
  if(q.includes("smvc") || q.includes("calculus")) return "SMVC (Single and Multivariable Calculus) covers differentiation and integration, partial derivatives, multiple integrals and vector calculus (Green\u2019s and Gauss\u2019s theorems). Check Courses \u2192 SMVC \u2192 Question Papers for the Winter 2024-25 paper.";
  if(q.includes("assignment")) return "You can track and check off assignments from the Assignments section on your dashboard.";
  if(q.includes("syllabus")) return "Open Courses (or Study Material → Subjects) and click any subject — its syllabus opens first.";
  if(q.includes("test") || q.includes("exam")) return "Unit tests for each subject are listed under Study Material → Tests. Attempt them after finishing the related notes.";
  if(q.includes("hello") || /\bhi\b/.test(q)) return "Hello! 👋 How can I help you with your studies today?";
  if(q.includes("thank")) return "You're welcome! 😊 Keep at it.";
  return "That's an interesting question! 📚\n\nI can currently help with Python, Engineering Mechanics, Engineering Chemistry, Communicative English, BEEE and SMVC. Try asking about one of these subjects.";
}

function showModal(title, bodyHtml, buttons, wide){
  const overlay = el(`<div class="modal-overlay" id="modal-overlay"></div>`);
  const box = el(`<div class="modal-box"><h3>${esc(title)}</h3><div id="modal-body"></div><div id="modal-actions" style="display:flex; gap:10px; margin-top:6px;"></div></div>`);

  const actions = box.querySelector('#modal-actions');
  buttons.forEach(b => {
    const btn = el(`<button class="btn ${b.cls}" style="flex:1;">${esc(b.label)}</button>`);
    btn.onclick = b.action;
    actions.appendChild(btn);
  });
  overlay.appendChild(box);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });

const FB_KEY = "edubridge_feedback_v1";
const FB_TYPES = {
  feedback:  { icon:"💬", label:"Feedback",  ph:"What's working, what could be better?" },
  review:    { icon:"⭐", label:"Review",    ph:"How was your experience with the portal or a subject?" },
  complaint: { icon:"🚩", label:"Complaint", ph:"Tell us what went wrong so it can be fixed…" }
};
let fbType = "feedback";
let fbRating = 0;
 
async function loadFeedback(){
  try{
    if(window.storage){
      const r = await window.storage.get(FB_KEY, true);
      return r && r.value ? JSON.parse(r.value) : [];
    }
    const raw = localStorage.getItem(FB_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
async function saveFeedback(list){
  try{
    if(window.storage){
      const r = await window.storage.set(FB_KEY, JSON.stringify(list), true);
      return !!r;
    }
    localStorage.setItem(FB_KEY, JSON.stringify(list));
    return true;
  }catch(e){ console.error("feedback save failed", e); return false; }
}

function setFbType(t){
  fbType = t;
  document.querySelectorAll('#fb-types button').forEach(b => b.classList.toggle('active', b.dataset.t === t));

function setFbRating(n){
  fbRating = n;
  const words = ["", "poor", "meh", "okay", "good", "loved it!"];
  document.querySelectorAll('#fb-stars button').forEach(b => b.classList.toggle('on', Number(b.dataset.n) <= n));
  document.getElementById('fb-star-label').textContent = words[n];

async function submitFeedback(){
  const msgEl = document.getElementById('fb-msg');
  const err = document.getElementById('fb-error');
  const btn = document.getElementById('fb-submit');
  const msg = msgEl.value.trim();
  const anon = document.getElementById('fb-anon').checked;
  const nameTyped = document.getElementById('fb-name').value.trim();
  const subject = document.getElementById('fb-subject').value;
 
  if(msg.length < 5){ err.textContent = "Please write at least a few words."; return; }
  if(fbType === 'review' && !fbRating){ err.textContent = "Please pick a star rating for your review."; return; }
  err.textContent = "";
  btn.disabled = true; btn.textContent = "Sending…";
 
  const rec = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    type: fbType,
    rating: fbType === 'review' ? fbRating : 0,
    subject,
    message: msg,
    name: anon ? "Anonymous" : (nameTyped || (currentEmail && users[currentEmail] ? users[currentEmail].name : "Anonymous")),
    role: anon ? "" : (currentRole || ""),
    ts: Date.now()
  };
  const list = await loadFeedback();
  list.push(rec);
  const ok = await saveFeedback(list.slice(-500));
  if(!ok){
    btn.disabled = false; btn.textContent = "Send it ✈";
    err.textContent = "Couldn't save right now. Please try again.";
    return;
  }
  const panel = document.getElementById('fb-panel');
  panel.innerHTML = `
    <div class="fb-done">
      <svg viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 34 C8 18 20 8 34 9 C48 10 57 21 55 35 C53 49 41 57 29 55 C17 53 8 46 8 34 Z" stroke="#38BDF8" stroke-width="3" fill="#101B2E"/>
        <path d="M19 33 L28 42 L46 22" stroke="#34D399" stroke-width="4.5"/>
      </svg>
      <h4>Thank you!</h4>
      <p>Your ${esc(FB_TYPES[rec.type].label.toLowerCase())} has been sent to the mentors.</p>
      <div class="row">
        <button class="btn btn-ghost btn-full" onclick="renderFeedbackPanel()">Send another</button>
        <button class="btn btn-primary btn-full" onclick="toggleFeedback()">Close</button>
      </div>
    </div>`;
}

  list.forEach(f => { if(counts[f.type] !== undefined) counts[f.type]++; });
  const stars = n => "★".repeat(n) + "☆".repeat(5-n);
  const items = list.length ? list.map(f => {
    const t = FB_TYPES[f.type] || FB_TYPES.feedback;
    const subj = f.subject ? subjectName(f.subject) : "General";
    return `

      <div class="fb-item-top">
        <span class="badge-mono">${t.icon} ${esc(t.label.toUpperCase())}</span>

  closeModal();

}
 
async function deleteFeedback(id){
  if(!confirm("Delete this entry?")) return;
  const list = (await loadFeedback()).filter(f => f.id !== id);
  await saveFeedback(list);
  mentorViewFeedback();
}

          <span class="eyebrow">// INTERVIEW PREP · ${esc(key.toUpperCase())}</span>

          <p>${c.items.length} questions · click a question to see the answer.</p>
        </div>
        <div style="max-width:860px;">
          ${c.items.map((x,i) => `
            <details class="paper-card">
              <summary><span class="badge-mono">Q${i+1}</span><span>${esc(x.q)}</span></summary>
              <div class="paper-body">
                <p class="iv-ans">${esc(x.a)}</p>
                ${x.code ? `<pre class="qb-code">${esc(x.code)}</pre>` : ""}
              </div>
            </details>`).join("")}
        </div>
        <button class="btn btn-ghost" onclick="screenInterviewHome()">← Back to interview prep</button>
        <div style="height:40px;"></div>
      </div>
    </main>
  `);
}
 
async function boot(){
  users = await loadUsers();
  mountFeedbackWidget();
  screenLogin();
}
boot();
</script>
</body>
</html>
